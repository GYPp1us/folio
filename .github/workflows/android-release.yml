name: Android release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Android release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Select release tag
        id: release-tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:REQUESTED_TAG -cnotmatch '^android-v\d+\.\d+\.\d+$') {
            throw 'Expected an Android release tag such as android-v0.5.6'
          }
          "ref=refs/tags/$env:REQUESTED_TAG" >> $env:GITHUB_OUTPUT
          "FOLIO_ANDROID_TAG=$env:REQUESTED_TAG" >> $env:GITHUB_ENV

      - name: Check out release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ steps.release-tag.outputs.ref }}

      - name: Validate version
        run: |
          $manifest = [xml](Get-Content -Raw apps/android/AndroidManifest.xml)
          $version = $manifest.manifest.GetAttribute('versionName', 'http://schemas.android.com/apk/res/android')
          if ($env:FOLIO_ANDROID_TAG -cne "android-v$version") {
            throw 'Release tag must match the Android manifest version'
          }
          "FOLIO_ANDROID_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build and verify signed APK
        env:
          FOLIO_ANDROID_KEYSTORE_BASE64: ${{ secrets.FOLIO_ANDROID_KEYSTORE_BASE64 }}
          FOLIO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FOLIO_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (!$env:FOLIO_ANDROID_KEYSTORE_BASE64 -or !$env:FOLIO_ANDROID_KEYSTORE_PASSWORD) {
            throw 'Android release signing secrets are missing'
          }
          $signingDir = Join-Path $env:RUNNER_TEMP ("folio-signing-" + [guid]::NewGuid().ToString('N'))
          $keystore = Join-Path $signingDir 'folio-release.jks'
          $password = Join-Path $signingDir 'store.pass'
          $outputDir = Join-Path $env:RUNNER_TEMP 'folio-android'
          New-Item -ItemType Directory -Path $signingDir | Out-Null
          try {
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:FOLIO_ANDROID_KEYSTORE_BASE64))
            [IO.File]::WriteAllText($password, $env:FOLIO_ANDROID_KEYSTORE_PASSWORD, [Text.Encoding]::ASCII)
            Remove-Item Env:FOLIO_ANDROID_KEYSTORE_BASE64, Env:FOLIO_ANDROID_KEYSTORE_PASSWORD
            ./apps/android/build.ps1 -OutputDir $outputDir -SigningDir $signingDir
          } finally {
            Remove-Item -LiteralPath $keystore, $password, $signingDir -Force -ErrorAction SilentlyContinue
          }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:FOLIO_ANDROID_VERSION
          $name = "Folio-$version-android.apk"
          $apk = Join-Path $env:RUNNER_TEMP "folio-android/$name"
          $checksum = "$apk.sha256"
          $digest = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $name" | Set-Content -LiteralPath $checksum -Encoding ascii
          gh release create $env:FOLIO_ANDROID_TAG $apk $checksum --repo $env:GITHUB_REPOSITORY --verify-tag --notes-from-tag --title "Folio Android $version" --latest
