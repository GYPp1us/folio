# Before DNS and HTTPS are ready, expose only the ACME challenge endpoint.
server {
    listen 80;
    listen [::]:80;
    server_name folio.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/folio-acme; }
    location / {
        default_type text/plain;
        return 503 'Folio is installed. HTTPS will be enabled after DNS is ready. Use an SSH tunnel for initial setup.';
    }
}
